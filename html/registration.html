<head>
    <link rel="stylesheet" href="style.css">
</head>

<body>    
    <header>
        <img id="logo" src="img/logo.png" alt="">
        <nav>
            <a href="homepage.html">Domov</a>
            <a href="tournaments.html">Turnaje</a>
            <a href="tournament_history.html">História</a>
        </nav>
        <nav id="nav_right">
            <a href="registration.html">Registrácia</a>
        </nav>
    </header>
    
    <form id="registration_form">
        <h1>Registrácia</h1>
        <h2>Základné informácie</h2>
        <div class="form-row">
            <div class="form-group">
            <label for="firstName">Meno</label>
            <input type="text" id="firstName" name="firstName" required>
            </div>
            
            <div class="form-group">
            <label for="lastName">Priezvisko</label>
            <input type="text" id="lastName" name="lastName" required>
            </div>
        </div>
        
        <div class="form-row">
            <div class="form-group">
            <label for="gender">Pohlavie</label>
            <select id="gender" name="gender" required>
                <option value="">Vyberte pohlavie</option>
                <option value="male">Muž</option>
                <option value="female">Žena</option>
            </select>
            </div>
            
            <div class="form-group">
            <label for="birthDate">Dátum narodenia</label>
            <input type="date" id="birthDate" name="birthDate" required onchange="checkAge()">
            </div>
        </div>
    
        <h2>Klub</h2>
        <div class="form-row">
            <div class="form-group">
            <select id="gender" name="gender" required>
                <option value="">Vyberte klub</option>
                <option value="male">DC Trnava</option>
                <option value="female">DC Bratislava</option>
            </select>
            </div> 
        </div>

        <h2>Prihlasovacie údaje</h2>
        <div class="form-row">
            <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <label for="password">Heslo</label>
            <input type="password" id="password" name="password" required>
            </div>  
        </div>

        <div class="button-group">    
            <a href="homepage.html" class="button-link">Zrušiť</a>
            <button>Registrovať</button>
        </div>
    </form>
</body>
